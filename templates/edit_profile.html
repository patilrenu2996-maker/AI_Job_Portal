{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>Edit Profile</title>

    <link rel="stylesheet" href="{% static 'css/edit_profile.css' %}">

</head>

<body>

<div class="profile-container">

    <h2>Edit Profile</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="input-box">

            <label>Full Name</label>

            <input type="text" 
            name="full_name" 
            value="{{user.full_name}}">

        </div>


        <div class="input-box">

            <label>Email</label>

            <input type="email" 
            name="email" 
            value="{{user.email}}">

        </div>


        <div class="input-box">

            <label>Phone Number</label>

            <input type="text" 
            name="phone" 
            value="{{user.phone}}">

        </div>


        <button type="submit" class="update-btn">
            Update Profile
        </button>


    </form>


    <a href="{% url 'profile' %}" class="back-link">
        Back to Profile
    </a>


</div>


</body>
</html>
